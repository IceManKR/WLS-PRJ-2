version: '3.9'
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wlsdb
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      DB_URL: postgres://postgres:postgres@db:5432/wlsdb

volumes:
  db_data:
